<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>PorraElecciones</title>
    <meta
      name="description"
      content="Pronostica el reparto de los 350 escaños del Congreso de los Diputados y compara las porras cuando se cierre el plazo."
    />
    <link rel="canonical" href="https://purnpum.github.io/PorraElecciones/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="PorraElecciones" />
    <meta
      property="og:description"
      content="Pronostica el reparto de los 350 escaños del Congreso de los Diputados."
    />
    <meta
      property="og:url"
      content="https://purnpum.github.io/PorraElecciones/"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#18181b"
    />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="PorraElecciones" />
    <meta name="application-name" content="PorraElecciones" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- One file holds every weight of the Latin letters, so the text can
      start in the right font instead of swapping in later -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/ibm-plex-sans/files/ibm-plex-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var d =
            t === "dark" ||
            (t !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", d);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Activa JavaScript para participar en PorraElecciones.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
